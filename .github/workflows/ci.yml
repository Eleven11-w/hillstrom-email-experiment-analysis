name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify frozen input
        shell: pwsh
        run: .\scripts\prepare_data.ps1
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Rebuild all analysis artifacts
        run: python -m src.run_all
      - name: Verify release evidence
        run: python -m src.verify_release
